[project]
name = "inference-platform"
version = "0.1.0"
description = "Mini inference platform: simulated + real LLM backends, a router with failover/canary/shadow/drain, a load tester, and an autoscaler simulator."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
mockllm   = "inference_platform.mockllm.server:main"
loadtest  = "inference_platform.loadtest.run:main"
router    = "inference_platform.router.app:main"
autosim   = "inference_platform.autoscaler.sim:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
